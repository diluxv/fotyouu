            { tiempo: 171, texto: "Te amo Daniela <333"}
        ];

        const audio = document.getElementById("audio");
        const video = document.getElementById("fondo");
        const lineaEl = document.getElementById("linea");
        const entrada = document.getElementById("entrada");

        let actual = -2;
        function actualizar() {
            const t = audio.currentTime;
            let idx = -1;
            for (let i = 0; i < letra.length; i++) {
            if (t >= letra[i].tiempo) idx = i; else break;
            }

            if (idx >= 0 && letra[idx].fin !== undefined && t >= letra[idx].fin) idx = -1;

            if (idx === actual) return;
            actual = idx;

            lineaEl.classList.remove("visible");
            setTimeout(() => {
            if (actual === idx && idx >= 0) {
                lineaEl.textContent = letra[idx].texto;
                lineaEl.classList.add("visible");
            }
            }, 250);
        }
        audio.addEventListener("timeupdate", actualizar);
        audio.addEventListener("seeked", actualizar);

        function iniciar() {
            audio.currentTime = 0;
            video.currentTime = 0;
            audio.play();
            video.play();
            entrada.classList.add("oculta");
        }
        document.getElementById("btnEntrar").addEventListener("click", iniciar);

        audio.addEventListener("pause", () => video.pause());
        audio.addEventListener("play", () => video.play());
    </script>
